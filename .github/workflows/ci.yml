name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm ci, not npm install: npm 10's install crashes on this workspace without a lockfile.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -w song-resolver
      - run: npm test -w song-resolver

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w chrome-extension
      - run: npm test -w chrome-extension
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Full Chromium, not the headless shell: only it can load extensions.
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      # The browser came from the cache; the system libraries it needs didn't.
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: npm run test:e2e -w chrome-extension
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: packages/chrome-extension/test-results/

  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pwa -w song-resolver
      - run: npm run test:pwa -w song-resolver
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      # Runs against wrangler dev locally; no Cloudflare account needed.
      - run: npm run test:pwa:e2e -w song-resolver
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-app-e2e-results
          path: packages/song-resolver/test-results/

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w site
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      # Runs against wrangler pages dev, so _headers and the CSP are tested as deployed.
      - run: npm test -w site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-e2e-results
          path: packages/site/test-results/
