name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci, not npm install: npm 10's install crashes on this workspace without a lockfile.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -w song-resolver
      - run: npm test -w song-resolver
